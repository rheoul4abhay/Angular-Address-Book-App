<div class="w-full px-36 py-10">
    <div class="w-full flex justify-between items-center select-none">
        <h3 class="text-2xl font-medium text-gray-700">
            {{pageTitle}}
        </h3>
        <div class="flex justify-center items-center gap-2 bg-blue-500 text-white fill-white p-3 px-12 rounded-md hover:cursor-pointer hover:bg-blue-600" (click)="addPersonOnClick($event)">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" class="w-5"><path d="M256 80c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 144L48 224c-17.7 0-32 14.3-32 32s14.3 32 32 32l144 0 0 144c0 17.7 14.3 32 32 32s32-14.3 32-32l0-144 144 0c17.7 0 32-14.3 32-32s-14.3-32-32-32l-144 0 0-144z"/></svg>
            Add Person
        </div>
    </div>

    <!--Person Details Table-->
    <div class="mt-10 overflow-x-auto">
        <table 
            class="w-full bg-gray-100 border border-none rounded-md shadow-sm border-spacing: 0 1.5rem"
            *ngIf="persons.length > 0; else noPersons">
            <thead class="bg-gray-100 text-blue- border border-none font-medium">
                <tr>
                    <th class="py-2 px-4 text-left text-base font-semibold">Fullname</th>
                    <th class="py-2 px-4 text-left text-base font-semibold">Address</th>
                    <th class="py-2 px-4 text-left text-base font-semibold">City</th>
                    <th class="py-2 px-4 text-left text-base font-semibold">State</th>
                    <th class="py-2 px-4 text-left text-base font-semibold">Zip Code</th>
                    <th class="py-2 px-4 text-left text-base font-semibold">Phone Number</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let person of persons" class="border border-gray-200 bg-white text-lg shadow-md hover:shadow-xl rounded-md">
                    <td class="py-3 px-4 text-gray-700">{{person.name}}</td>
                    <td class="py-3 px-4 text-gray-700">{{person.address}}</td>
                    <td class="py-3 px-4 text-gray-700">{{person.city}}</td>
                    <td class="py-3 px-4 text-gray-700">{{person.state}}</td>
                    <td class="py-3 px-4 text-gray-700">{{person.zip}}</td>
                    <td class="py-3 px-4 text-gray-700">{{person.phone}}</td>
                </tr>
            </tbody>
        </table>
        <ng-template #noPersons>
            <p class="text-gray-600 text-center my-20 py-10 text-3xl font-mono">
                Address Book is Empty.
            </p>
        </ng-template>
    </div>
</div>
